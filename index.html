<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Album Bersama</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111;--card:#1b1b1b;--tx:#f1ece4;--mu:#9a958d;--ac:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:Georgia,serif;font-weight:700;margin:0}
section{display:none;max-width:480px;margin:auto;padding:24px 20px 60px}
section.on{display:block}
.center{text-align:center}
input[type=text]{width:100%;padding:16px;border-radius:16px;border:1px solid #333;background:var(--card);color:var(--tx);font-size:16px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:var(--tx);color:#111;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid #333}
.dash{padding:0!important}
.dash .in{padding:0 20px 60px}
.cover{height:300px;background:linear-gradient(135deg,#5a4a3f,#2a2a2a) center/cover;position:relative}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#111)}
.ttl{font-family:"Playfair Display",Georgia,serif;font-size:36px;text-align:center;margin:-30px 0 26px;position:relative;z-index:1;line-height:1.15}
.stats{display:flex;margin-bottom:26px}
.stats div{flex:1;text-align:center;border-left:1px solid #2a2a2a}
.stats div:first-child{border:0}
.stats b{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:40px;display:block;line-height:1.1}
.stats b i{font-family:system-ui;font-size:22px;color:var(--mu)}
.stats span{color:var(--mu);font-size:18px}
.acts{display:grid;grid-template-columns:2.6fr 1fr 1fr 1fr;gap:12px}
.acts button{height:76px;border-radius:26px;border:1px solid #333;background:transparent;color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.acts button:first-child{background:#ebe6df;color:#111;border:0}
.acts svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.up{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding:20px 22px;border:1px solid #1f4a8a;border-radius:24px;background:#121a27;cursor:pointer}
.up small{color:#4a90e2;letter-spacing:.18em;font-weight:700;font-size:15px}
.up b{display:block;font-size:26px;margin:4px 0}
.up p{margin:0;color:var(--mu);font-size:18px}
.up i{width:60px;height:60px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:28px;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.grid div{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:1/1.0;background:var(--card)}
.grid img{width:100%;height:100%;object-fit:cover}
.grid div:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#000a)}
.grid small{position:absolute;left:18px;bottom:14px;font-style:italic;font-size:20px;z-index:1}
.modal{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.on{display:flex}
.modal img{max-width:100%;max-height:55vh;border-radius:16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px 0;max-width:100%}
.chip{padding:8px 16px;border-radius:99px;border:1px solid #444;background:var(--card);color:var(--tx);white-space:nowrap}
.chip.on{background:var(--tx);color:#111}
canvas{width:100%;border-radius:16px;margin:16px 0}
.hint{color:var(--mu);font-size:14px}
</style>
</head>
<body>

<!-- 1. HALAMAN DEPAN -->
<section id="home" class="on center">
  <div style="height:60px"></div>
  <p class="hint">Diundang oleh host</p>
  <h1 style="font-size:36px;margin:10px 0 28px" id="title">Hari Pernikahan Kita</h1>
  <input type="text" id="name" placeholder="Masukkan namamu" maxlength="30">
  <button class="btn" id="enter">Masuk ke album →</button>
</section>

<!-- 2. DASHBOARD ALBUM -->
<section id="album" class="dash">
  <div class="cover" id="cover"></div>
  <div class="in">
  <h1 class="ttl" id="title2"></h1>
  <div class="stats">
    <div><b id="sMoment">0</b><span>Momen</span></div>
    <div><b id="sLeft">-</b><span>Tersisa</span></div>
    <div><b><span id="sPeople" style="color:inherit;font-size:inherit">0</span><i>/<span id="mx">5</span></i></b><span>Orang ›</span></div>
  </div>
  <div class="acts">
    <button id="cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button id="qrBtn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v3M14 21h3M21 21h0"/></svg></button>
    <button id="gal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="16" height="16" rx="2"/><path d="M3 17l5-5 4 4 3-3 4 4M19 2v6M16 5h6"/></svg></button>
    <button id="dl"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 16l5-5 5 5M12 9v7M9 14l3 3 3-3"/></svg></button>
  </div>
  <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="fGal" accept="image/*" hidden>
  <div class="up" id="up"><div><small>UPGRADE ACARA INI?</small><b>Tambah pax</b><p>Paket gratis dibatasi 5 tamu</p></div><i>→</i></div>
  <div class="grid" id="grid"></div>
  </div>
</section>

<!-- 3. BINGKAI QR -->
<section id="qr" class="center">
  <button class="btn alt" id="back" style="width:auto;display:inline-block;padding:10px 20px">← Kembali</button>
  <h2 style="margin-top:20px">Acaramu sudah siap</h2>
  <p class="hint">Tempel QR ini di lokasi acara biar tamu gampang mulai memotret.</p>
  <canvas id="qrCanvas" width="800" height="1100"></canvas>
  <button class="btn" id="saveQr">⬇ Simpan QR</button>
</section>

<!-- Modal unggah + filter -->
<div class="modal" id="modal">
  <img id="prev">
  <div class="chips" id="chips"></div>
  <div class="row" style="width:100%;max-width:400px">
    <button class="btn alt" id="cancel">Batal</button>
    <button class="btn" id="send">Unggah</button>
  </div>
</div>

<script>
// ====== PENGATURAN: isi dari Supabase (Project Settings > API) ======
const SUPA_URL = "https://ofwoephdirefoclwmnjg.supabase.co/rest/v1/";
const SUPA_KEY = "sb_publishable_nSbubnH5fWmPBUhsGnEvzw__LncTnXl";
const EVENT_TITLE = "The Wedding Of Kharisma & Azizul";
const EVENT_END = "2027-01-02T23:59:00"; // batas waktu acara
const MAX_GUESTS = 5;                    // batas tamu paket gratis
// ====================================================================

const DEMO = SUPA_URL.startsWith("ISI");
const BASE = DEMO ? "" : new URL(SUPA_URL).origin; // buang path tambahan seperti /rest/v1
const db = DEMO ? null : supabase.createClient(BASE, SUPA_KEY);
const local = [];
const ALBUM = (new URLSearchParams(location.search).get("a") || "acara").replace(/[^a-zA-Z0-9_-]/g, "").slice(0,40) || "acara";
let rows = [];
const $ = id => document.getElementById(id);
const FILTERS = {
  Asli: "none",
  Pop: "saturate(1.8) contrast(1.15) brightness(.95)",
  Digicam: "saturate(1.2) contrast(1.1) hue-rotate(-10deg) brightness(1.1)",
  Film: "sepia(.35) contrast(1.05) saturate(1.2)",
  Mono: "grayscale(1) contrast(1.15)"
};
let me = localStorage.getItem("nama") || "", file = null, filt = "Asli";

function show(id){ document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id)); }
$("title").textContent = $("title2").textContent = EVENT_TITLE;
$("name").value = me; $("mx").textContent = MAX_GUESTS;

// 1. Masuk
$("enter").onclick = () => {
  const n = $("name").value.trim();
  if(!n) return alert("Masukkan namamu dulu");
  me = n; localStorage.setItem("nama", n);
  show("album"); load();
};

// 2. Dashboard
const photoUrl = p => DEMO ? p.url : db.storage.from("photos").getPublicUrl(p.path).data.publicUrl;
async function load(){
  let data;
  if(DEMO){ data = local; }
  else {
    const r = await db.from("photos").select("*").eq("album", ALBUM).order("created_at", {ascending:false});
    if(r.error) return alert("Gagal memuat: " + r.error.message);
    data = r.data;
  }
  rows = data;
  $("sMoment").textContent = data.length;
  $("sPeople").textContent = new Set(data.map(p => p.name)).size;
  const ms = new Date(EVENT_END) - Date.now();
  $("sLeft").textContent = ms <= 0 ? "Selesai" : Math.floor(ms/864e5) + "d " + Math.floor(ms%864e5/36e5) + "h";
  if(data[0]) $("cover").style.backgroundImage = `url(${photoUrl(data[data.length-1])})`;
  $("grid").innerHTML = "";
  data.forEach(p => {
    const url = photoUrl(p);
    const d = document.createElement("div");
    d.innerHTML = `<img loading="lazy" src="${url}" style="filter:${FILTERS[p.filter]||"none"}"><small></small>`;
    d.querySelector("small").textContent = p.name;
    $("grid").appendChild(d);
  });
}
$("cam").onclick = () => $("fCam").click();
$("gal").onclick = () => $("fGal").click();
[$("fCam"), $("fGal")].forEach(i => i.onchange = () => {
  if(!i.files[0]) return;
  file = i.files[0]; filt = "Asli";
  $("prev").src = URL.createObjectURL(file); $("prev").style.filter = "none";
  $("chips").innerHTML = "";
  Object.keys(FILTERS).forEach(k => {
    const b = document.createElement("button");
    b.className = "chip" + (k === filt ? " on" : ""); b.textContent = k;
    b.onclick = () => { filt = k; $("prev").style.filter = FILTERS[k];
      document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b)); };
    $("chips").appendChild(b);
  });
  $("modal").classList.add("on"); i.value = "";
});
$("up").onclick = () => alert("Upgrade belum tersedia.");
$("dl").onclick = async () => {
  for(const p of rows){
    const b = await (await fetch(photoUrl(p))).blob();
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "momen-" + (p.id||Date.now()) + ".jpg"; a.click();
    await new Promise(r => setTimeout(r, 400));
  }
};
$("cancel").onclick = () => $("modal").classList.remove("on");

// Kecilkan foto sebelum unggah (hemat storage gratis)
function shrink(f, max = 1600){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(res, "image/jpeg", .85);
    };
    img.src = URL.createObjectURL(f);
  });
}
$("send").onclick = async () => {
  const names = new Set(rows.map(p => p.name));
  if(!names.has(me) && names.size >= MAX_GUESTS) return alert("Paket gratis dibatasi " + MAX_GUESTS + " tamu.");
  $("send").disabled = true; $("send").textContent = "Mengunggah...";
  try {
    const blob = await shrink(file);
    if(DEMO){ local.unshift({name:me, filter:filt, url:URL.createObjectURL(blob)}); $("modal").classList.remove("on"); load(); throw {message:""}; }
    const path = `${ALBUM}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
    let r = await db.storage.from("photos").upload(path, blob, {contentType:"image/jpeg"});
    if(r.error) throw r.error;
    r = await db.from("photos").insert({album:ALBUM, name:me, path, filter:filt});
    if(r.error) throw r.error;
    $("modal").classList.remove("on"); load();
  } catch(e){ if(e.message) alert("Gagal: " + e.message); }
  $("send").disabled = false; $("send").textContent = "Unggah";
};

// 3. Bingkai QR
$("qrBtn").onclick = () => { show("qr"); drawQR(); };
$("back").onclick = () => show("album");
function drawQR(){
  const c = $("qrCanvas"), x = c.getContext("2d"), W = c.width, H = c.height;
  x.fillStyle = "#faf8f4"; x.fillRect(0, 0, W, H);
  // bingkai ganda
  x.strokeStyle = "#b9a98c"; x.lineWidth = 4; x.strokeRect(30, 30, W-60, H-60);
  x.lineWidth = 1.5; x.strokeRect(48, 48, W-96, H-96);
  // hiasan sudut
  x.lineWidth = 3;
  [[60,60,1,1],[W-60,60,-1,1],[60,H-60,1,-1],[W-60,H-60,-1,-1]].forEach(([px,py,sx,sy]) => {
    x.beginPath(); x.arc(px+sx*30, py+sy*30, 30, 0, 7); x.stroke();
    x.beginPath(); x.arc(px+sx*30, py+sy*30, 14, 0, 7); x.stroke();
    x.beginPath(); x.moveTo(px+sx*60, py); x.quadraticCurveTo(px+sx*110, py+sy*40, px+sx*170, py); x.stroke();
    x.beginPath(); x.moveTo(px, py+sy*60); x.quadraticCurveTo(px+sx*40, py+sy*110, px, py+sy*170); x.stroke();
  });
  x.fillStyle = "#222"; x.textAlign = "center";
  x.font = "52px Georgia,serif"; x.fillText("B A G I K A N", W/2, 250);
  x.font = "italic 130px Georgia,serif"; x.fillText("Foto", W/2, 390);
  x.font = "44px Georgia,serif"; x.fillText("K A L I A N   D I   S I N I", W/2, 470);
  // QR
  const url = location.origin + location.pathname + "?a=" + ALBUM;
  const q = qrcode(0, "M"); q.addData(url); q.make();
  const n = q.getModuleCount(), size = 460, cell = size / n, ox = (W-size)/2, oy = 530;
  x.fillStyle = "#fff"; x.fillRect(ox-20, oy-20, size+40, size+40);
  x.fillStyle = "#000";
  for(let r = 0; r < n; r++) for(let k = 0; k < n; k++)
    if(q.isDark(r, k)) x.fillRect(ox + k*cell, oy + r*cell, cell+.5, cell+.5);
  x.fillStyle = "#777"; x.font = "30px Georgia,serif";
  x.fillText("Pindai kode QR dan unggah momenmu", W/2, 1120 - 60);
}
$("saveQr").onclick = () => {
  const a = document.createElement("a");
  a.download = "qr-album.png"; a.href = $("qrCanvas").toDataURL("image/png"); a.click();
};
</script>
</body>
</html>
