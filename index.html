<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Wedding Of Kharisma &amp; Azizul</title>
<meta name="theme-color" content="#1a130b">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a130b;--card:#261c11;--tx:#f3e9d8;--mu:#a8987f;--ac:#d9b779}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:Georgia,serif;font-weight:700;margin:0}
section{display:none;max-width:480px;margin:auto;padding:24px 20px 60px}
section.on{display:block}
.center{text-align:center}
input[type=text]{width:100%;padding:16px;border-radius:16px;border:1px solid #3d2f1e;background:var(--card);color:var(--tx);font-size:16px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:#d9b779;color:#1a130b;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid #3d2f1e}
.dash{padding:0!important}
.dash .in{padding:0 20px 60px}
.cover{height:300px;background:linear-gradient(135deg,#5a4a3f,#33271a) center/cover;position:relative}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#1a130b)}
.ttl{font-family:"Playfair Display",Georgia,serif;font-size:36px;text-align:center;margin:-30px 0 26px;position:relative;z-index:1;line-height:1.15}
.stats{display:flex;margin-bottom:26px}
.stats div{flex:1;text-align:center;border-left:1px solid #33271a}
.stats div:first-child{border:0}
.stats .n{font-family:inherit;font-size:inherit;color:inherit}
.stats b{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:40px;display:block;line-height:1.1}
.stats b i{font-family:system-ui;font-size:22px;color:var(--mu)}
.stats span{color:var(--mu);font-size:18px}
.acts{display:flex;gap:12px}
.acts button{flex:1}.acts button:first-child{flex:2.6}
.acts button{height:76px;border-radius:26px;border:1px solid #3d2f1e;background:transparent;color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.acts button:first-child{background:#d9b779;color:#1a130b;border:0}
.acts svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.up{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding:20px 22px;border:1px solid #1f4a8a;border-radius:24px;background:#121a27;cursor:pointer}
.up small{color:#4a90e2;letter-spacing:.18em;font-weight:700;font-size:15px}
.up b{display:block;font-size:26px;margin:4px 0}
.up p{margin:0;color:var(--mu);font-size:18px}
.up i{width:60px;height:60px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:28px;color:#fff}
.note{margin-top:22px;padding:20px 22px;border:1px dashed #3d2f1e;border-radius:24px;color:var(--mu);font-size:17px;line-height:1.5;text-align:center}
.note:empty{display:none}
.grid button{position:absolute;right:12px;top:12px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.grid div{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:1/1.0;background:var(--card)}
.grid img{width:100%;height:100%;object-fit:cover}
.grid div:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#000a)}
.grid small{position:absolute;left:18px;bottom:14px;font-style:italic;font-size:20px;z-index:1}
.adm{max-width:720px!important}
.adm header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.adm h2{font-size:22px;line-height:1.25}
.adm h3{font-family:system-ui;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:30px 0 10px;display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cards div{border:1px solid #3d2f1e;border-radius:14px;padding:14px 16px}
.cards span{display:block;color:var(--mu);font-size:13px}
.cards b{display:block;font-size:26px;font-weight:600;margin-top:4px}
.sm{padding:9px 14px;border-radius:10px;border:1px solid #3d2f1e;background:transparent;color:var(--tx);font-size:14px;cursor:pointer}
.sm.pri{background:#d9b779;color:#1a130b;border:0;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;color:var(--mu);font-size:14px}
.adm table{width:100%;border-collapse:collapse;font-size:15px}
.adm td,.adm th{padding:11px 4px;border-bottom:1px solid #2c2216;text-align:left}
.adm th{color:var(--mu);font-weight:500;font-size:13px}
.adm tr.rw{cursor:pointer}.adm tr.sel td{color:#d9b779}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.agrid figure{margin:0}
.agrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.agrid figcaption{font-size:12px;color:var(--mu);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.agrid figcaption span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agrid button{background:none;border:0;color:var(--tx);font-size:15px;padding:2px 4px;cursor:pointer}
.adm select,.adm input[type=date]{background:var(--card);color:var(--tx);border:1px solid #3d2f1e;border-radius:10px;padding:8px;font-size:14px;max-width:55%}
.empty{color:var(--mu);font-size:14px;padding:16px 0}
.modal{position:fixed;inset:0;background:#1a130bf5;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.on{display:flex}
.modal img{max-width:100%;max-height:55vh;border-radius:16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px 0;max-width:100%}
.chip{padding:8px 16px;border-radius:99px;border:1px solid #444;background:var(--card);color:var(--tx);white-space:nowrap}
.chip.on{background:var(--tx);color:#111}
canvas{width:100%;border-radius:16px;margin:16px 0}
.hint{color:var(--mu);font-size:14px}
</style>
</head>
<body>

<!-- 1. HALAMAN DEPAN -->
<section id="home" class="on center">
  <div style="height:60px"></div>
  <p class="hint">Bagikan momen foto kalian di sini.</p>
  <h1 style="font-size:34px;margin:14px 0 30px;line-height:1.2" id="title">Hari Pernikahan Kita</h1>
  <input type="text" id="name" placeholder="Masukkan namamu" maxlength="30">
  <button class="btn" id="enter">Masuk ke album →</button>
  <p class="hint" style="margin-top:28px"><a href="#" id="ownerLink" style="color:inherit">Masuk sebagai pemilik</a></p>
</section>

<!-- 2. DASHBOARD ALBUM -->
<section id="album" class="dash">
  <div class="cover" id="cover"></div>
  <div class="in">
  <h1 class="ttl" id="title2"></h1>
  <div class="stats">
    <div><b><span id="sMoment" class="n">0</span><i>/<span id="mx">10</span></i></b><span id="lMoment">Fotomu</span></div>
    <div><b id="sLeft">-</b><span>Tersisa</span></div>
    <div id="boxPpl" style="display:none"><b><span id="sPeople" class="n">0</span></b><span>Perangkat</span></div>
  </div>
  <div class="acts">
    <button id="cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button id="qrBtn" style="display:none"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v3M14 21h3M21 21h0"/></svg></button>
    <button id="dl"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 16l5-5 5 5M12 9v7M9 14l3 3 3-3"/></svg></button>
  </div>
  <div class="note" id="note"></div>
  <div class="grid" id="grid"></div>
  </div>
</section>

<!-- ADMIN -->
<section id="admin" class="adm">
  <header>
    <div><h2 id="aTitle"></h2><p class="hint" id="aSub" style="margin:4px 0 0"></p></div>
    <button class="sm" id="aOut">Keluar</button>
  </header>
  <div class="cards">
    <div><span>Total foto</span><b id="aTotal">0</b></div>
    <div><span>Tamu (perangkat)</span><b id="aDev">0</b></div>
    <div><span>Status</span><b id="aStat">-</b></div>
    <div><span>Sisa waktu</span><b id="aLeft">-</b></div>
  </div>
  <div class="bar">
    <button class="sm pri" id="aDl">Unduh foto</button>
    <button class="sm" id="aQr">Bingkai QR</button>
  </div>
  <div class="bar">
    <span>Acara selesai</span><input type="date" id="aDate"><button class="sm" id="aSave">Simpan</button>
  </div>
  <h3>Tamu</h3>
  <table><thead><tr><th>Nama</th><th>Foto</th><th>Terakhir</th></tr></thead><tbody id="aTbl"></tbody></table>
  <h3><span>Foto</span><select id="aFilter"></select></h3>
  <div class="agrid" id="aGrid"></div>
</section>

<!-- 3. BINGKAI QR -->
<section id="qr" class="center">
  <button class="btn alt" id="back" style="width:auto;display:inline-block;padding:10px 20px">← Kembali</button>
  <h2 style="margin-top:20px">Acaramu sudah siap</h2>
  <p class="hint">Tempel QR ini di lokasi acara biar tamu gampang mulai memotret.</p>
  <canvas id="qrCanvas" width="800" height="1100"></canvas>
  <button class="btn" id="saveQr">⬇ Simpan QR</button>
</section>

<div class="modal" id="camv" style="padding:0;justify-content:space-between">
  <video id="vid" autoplay playsinline muted style="width:100%;flex:1;min-height:0;object-fit:cover"></video>
  <div class="row" style="width:100%;padding:22px;align-items:center;justify-content:space-around">
    <button class="chip" id="camX">Tutup</button>
    <button id="shut" aria-label="Ambil foto" style="width:78px;height:78px;border-radius:50%;border:5px solid #d9b779;background:#fff"></button>
    <button class="chip" id="flip">Putar</button>
  </div>
</div>
<div id="toast" style="position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#ebe6df;color:#111;padding:12px 22px;border-radius:99px;display:none;z-index:20"></div>
<!-- Modal unggah + filter -->
<div class="modal" id="modal">
  <img id="prev">
  <div class="chips" id="chips"></div>
  <div class="row" style="width:100%;max-width:400px">
    <button class="btn alt" id="cancel">Ulangi</button>
    <button class="btn" id="send">Simpan foto</button>
  </div>
</div>

<script>
// ====== PENGATURAN: isi dari Supabase (Project Settings > API) ======
const SUPA_URL = "https://ofwoephdirefoclwmnjg.supabase.co";
const SUPA_KEY = "sb_publishable_nSbubnH5fWmPBUhsGnEvzw__LncTnXl";
const EVENT_TITLE = "The Wedding Of Kharisma & Azizul";
const MAX_PHOTOS = 10; // batas foto per perangkat (diperiksa juga di server)
// ====================================================================

const db = supabase.createClient(new URL(SUPA_URL).origin, SUPA_KEY);
const ALBUM = (new URLSearchParams(location.search).get("a") || "acara").replace(/[^a-zA-Z0-9_-]/g, "").slice(0,40) || "acara";
const $ = id => document.getElementById(id);
const FILTERS = {
  Asli: "none",
  Pop: "saturate(1.8) contrast(1.15) brightness(.95)",
  Digicam: "saturate(1.2) contrast(1.1) hue-rotate(-10deg) brightness(1.1)",
  Film: "sepia(.35) contrast(1.05) saturate(1.2)",
  Mono: "grayscale(1) contrast(1.15)"
};
let me = localStorage.getItem("nama") || "", file = null, filt = "Asli";
let rows = [], endAt = null, owner = sessionStorage.getItem("owner") || "";

// ID perangkat: disimpan di localStorage + cookie (browser tidak bisa membaca IMEI)
function deviceId(){
  let d = localStorage.getItem("did") || (document.cookie.match(/(?:^|; )did=([^;]+)/) || [])[1];
  if(!d || d.length < 16) d = crypto.randomUUID();
  localStorage.setItem("did", d);
  document.cookie = "did=" + d + ";max-age=63072000;path=/;SameSite=Lax";
  return d;
}
const DID = deviceId();
const photoUrl = p => db.storage.from("photos").getPublicUrl(p.path).data.publicUrl;
const toast = t => { $("toast").textContent = t; $("toast").style.display = "block"; setTimeout(() => $("toast").style.display = "none", 2600); };
const ended = () => endAt && Date.now() >= endAt;

function show(id){ document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id)); }
$("title").textContent = $("title2").textContent = EVENT_TITLE;
$("name").value = me; $("mx").textContent = MAX_PHOTOS;

// 1. Masuk
$("enter").onclick = () => {
  const n = $("name").value.trim();
  if(!n) return alert("Masukkan namamu dulu");
  me = n; localStorage.setItem("nama", n); owner = ""; sessionStorage.removeItem("owner");
  show("album"); load();
};
$("ownerLink").onclick = async e => {
  e.preventDefault();
  const p = prompt("Masukkan kode pemilik");
  if(!p) return;
  const r = await db.rpc("owner_photos", {p_pass: p});
  if(r.error) return alert("Kode pemilik salah");
  owner = p; sessionStorage.setItem("owner", p); show("admin"); loadAdmin();
};

// 2. Dashboard
async function load(){
  await checkCam();
  if(!endAt){
    const e = await db.rpc("event_end");
    if(e.error) return alert("Gagal memuat: " + e.error.message);
    endAt = new Date(e.data).getTime();
  }
  let mine = 0;
  if(owner){
    const r = await db.rpc("owner_photos", {p_pass: owner});
    if(r.error) return alert("Gagal memuat: " + r.error.message);
    rows = r.data; mine = rows.length;
  } else {
    const c = await db.rpc("my_count", {p_device: DID});
    if(c.error) return alert("Gagal memuat: " + c.error.message);
    mine = c.data; rows = [];
    if(ended()){
      const r = await db.rpc("my_photos", {p_device: DID});
      if(r.error) return alert("Gagal memuat: " + r.error.message);
      rows = r.data;
    }
  }
  $("sMoment").textContent = mine;
  $("mx").parentElement.style.display = owner ? "none" : "";
  $("lMoment").textContent = owner ? "Semua foto" : "Fotomu";
  $("boxPpl").style.display = owner ? "" : "none";
  $("qrBtn").style.display = owner ? "" : "none";
  $("sPeople").textContent = new Set(rows.map(p => p.device_id)).size;
  const ms = endAt - Date.now();
  $("sLeft").textContent = ms <= 0 ? "Selesai" : Math.floor(ms/864e5) + "d " + Math.floor(ms%864e5/36e5) + "h";
  $("cover").style.backgroundImage = rows.length ? `url(${photoUrl(rows[rows.length-1])})` : "";
  const tgl = new Date(endAt).toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
  const baseNote = owner ? "Mode pemilik: kamu melihat foto semua tamu."
    : ended() ? (rows.length ? "" : "Kamu belum mengunggah foto.")
    : "🔒 Foto bersifat privat. Hasil fotomu akan muncul di sini setelah acara selesai (" + tgl + ").";
  $("note").textContent = (noCam && !owner ? "📱 " + NOCAM_MSG + " " : "") + baseNote;
  $("cam").style.opacity = noCam ? .4 : 1;
  $("grid").innerHTML = "";
  rows.forEach(p => {
    const d = document.createElement("div");
    d.innerHTML = `<img loading="lazy" src="${photoUrl(p)}" style="filter:${FILTERS[p.filter]||"none"}"><button>⬇</button><small></small>`;
    d.querySelector("small").textContent = p.name;
    d.querySelector("button").onclick = () => save(p);
    $("grid").appendChild(d);
  });
}
async function save(p){
  const b = await (await fetch(photoUrl(p))).blob();
  const a = document.createElement("a"); a.href = URL.createObjectURL(b);
  a.download = "momen-" + p.path.split("/").pop(); a.click();
}
$("dl").onclick = async () => {
  if(!owner && !ended()) return alert("Foto bisa diunduh setelah acara selesai.");
  if(!rows.length) return alert("Belum ada foto.");
  for(const p of rows){ await save(p); await new Promise(r => setTimeout(r, 400)); }
};

function preview(f){
  file = f; filt = "Asli";
  $("prev").src = URL.createObjectURL(file); $("prev").style.filter = "none";
  $("chips").innerHTML = "";
  Object.keys(FILTERS).forEach(k => {
    const b = document.createElement("button");
    b.className = "chip" + (k === filt ? " on" : ""); b.textContent = k;
    b.onclick = () => { filt = k; $("prev").style.filter = FILTERS[k];
      document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); };
    $("chips").appendChild(b);
  });
  $("modal").classList.add("on");
}
let noCam = false;
const NOCAM_MSG = "Perangkat ini tidak memiliki kamera. Silakan buka website ini lewat HP untuk memotret.";
async function checkCam(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices){ noCam = true; return; }
    const d = await navigator.mediaDevices.enumerateDevices();
    noCam = !d.some(x => x.kind === "videoinput");
  }catch(e){ noCam = true; }
}
let stream = null, facing = "environment", fromCam = false;
function stopCam(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function startCam(){
  stopCam();
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1920}}, audio:false});
    $("vid").srcObject = stream;
    $("vid").style.transform = facing === "user" ? "scaleX(-1)" : "none";
  }catch(e){ $("camv").classList.remove("on"); if(e && e.name === "NotFoundError") return alert("📱 " + NOCAM_MSG); alert("Kamera tidak bisa dibuka. Izinkan akses kamera di browser, lalu coba lagi. Jika dibuka dari Instagram/WhatsApp, buka lewat Chrome atau Safari."); }
}
async function openCam(){
  if(ended()) return alert("Acara sudah selesai.");
  await checkCam();
  if(noCam) return alert("📱 " + NOCAM_MSG);
  const c = await db.rpc("my_count", {p_device: DID});
  if(!c.error && c.data >= MAX_PHOTOS) return alert("Batas " + MAX_PHOTOS + " foto per perangkat sudah tercapai.");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return alert("Browser ini tidak mendukung kamera. Buka lewat Chrome atau Safari.");
  fromCam = true; $("camv").classList.add("on"); startCam();
}
$("cam").onclick = openCam;
$("flip").onclick = () => { facing = facing === "user" ? "environment" : "user"; startCam(); };
$("camX").onclick = () => { stopCam(); $("camv").classList.remove("on"); };
$("shut").onclick = () => {
  const v = $("vid"); if(!v.videoWidth) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  c.toBlob(b => { stopCam(); $("camv").classList.remove("on"); fromCam = true; preview(b); }, "image/jpeg", .9);
};
$("cancel").onclick = () => { $("modal").classList.remove("on"); if(fromCam) openCam(); };

// Kecilkan foto sebelum unggah (hemat storage gratis)
function shrink(f, max = 1600){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(res, "image/jpeg", .85);
    };
    img.src = URL.createObjectURL(f);
  });
}
$("send").onclick = async () => {
  $("send").disabled = true; $("send").textContent = "Mengunggah...";
  try {
    const blob = await shrink(file);
    const path = `${ALBUM}/${crypto.randomUUID()}.jpg`;
    let r = await db.storage.from("photos").upload(path, blob, {contentType:"image/jpeg"});
    if(r.error) throw r.error;
    r = await db.rpc("add_photo", {p_album:ALBUM, p_name:me, p_path:path, p_filter:filt, p_device:DID});
    if(r.error){
      await db.storage.from("photos").remove([path]).catch(() => {});
      throw new Error(r.error.message.includes("LIMIT_REACHED") ? "Batas " + MAX_PHOTOS + " foto per perangkat sudah tercapai."
        : r.error.message.includes("EVENT_ENDED") ? "Acara sudah selesai." : r.error.message);
    }
    $("modal").classList.remove("on"); toast("Foto tersimpan ✓"); load();
  } catch(e){ alert("Gagal: " + e.message); }
  $("send").disabled = false; $("send").textContent = "Simpan foto";
};

// ===== ADMIN =====
let qrBack = "album", sel = "", cur = [];
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fDate = t => new Date(t).toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
const fTime = t => new Date(t).toLocaleString("id-ID", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
async function loadAdmin(){
  const e = await db.rpc("event_end"); if(!e.error) endAt = new Date(e.data).getTime();
  const r = await db.rpc("owner_photos", {p_pass: owner});
  if(r.error){ owner = ""; sessionStorage.removeItem("owner"); show("home"); return alert("Sesi pemilik tidak valid"); }
  rows = r.data;
  const g = {};
  rows.forEach(p => { const k = p.device_id || "-"; (g[k] = g[k] || {id:k, name:p.name, n:0, last:p.created_at}).n++; });
  const gs = Object.values(g);
  if(sel && !g[sel]) sel = "";
  $("aTitle").textContent = EVENT_TITLE;
  $("aSub").textContent = "Acara selesai " + fDate(endAt);
  $("aTotal").textContent = rows.length; $("aDev").textContent = gs.length;
  $("aStat").textContent = ended() ? "Selesai" : "Berlangsung";
  const ms = endAt - Date.now();
  $("aLeft").textContent = ms <= 0 ? "-" : Math.floor(ms/864e5) + " hari " + Math.floor(ms%864e5/36e5) + " jam";
  $("aDate").value = new Date(endAt + 7*36e5).toISOString().slice(0,10);
  $("aTbl").innerHTML = gs.length ? gs.map(x => `<tr class="rw${x.id===sel?" sel":""}" data-id="${esc(x.id)}"><td>${esc(x.name)}</td><td>${x.n}/${MAX_PHOTOS}</td><td>${fTime(x.last)}</td></tr>`).join("")
    : '<tr><td colspan="3" class="empty">Belum ada tamu.</td></tr>';
  $("aFilter").innerHTML = '<option value="">Semua tamu</option>' + gs.map(x => `<option value="${esc(x.id)}"${x.id===sel?" selected":""}>${esc(x.name)} (${x.n})</option>`).join("");
  renderGrid();
}
function renderGrid(){
  cur = sel ? rows.filter(p => (p.device_id || "-") === sel) : rows;
  $("aGrid").innerHTML = cur.length ? cur.map((p,i) => `<figure><img loading="lazy" src="${photoUrl(p)}" style="filter:${FILTERS[p.filter]||"none"}"><figcaption><span>${esc(p.name)} · ${fTime(p.created_at)}</span><span><button data-a="dl" data-i="${i}" title="Unduh">⬇</button><button data-a="del" data-i="${i}" title="Hapus">✕</button></span></figcaption></figure>`).join("")
    : '<p class="empty" style="grid-column:1/-1">Belum ada foto.</p>';
  document.querySelectorAll("#aTbl tr.rw").forEach(t => t.classList.toggle("sel", t.dataset.id === sel));
}
$("aTbl").onclick = e => { const t = e.target.closest("tr.rw"); if(!t) return; sel = t.dataset.id === sel ? "" : t.dataset.id; $("aFilter").value = sel; renderGrid(); };
$("aFilter").onchange = e => { sel = e.target.value; renderGrid(); };
$("aGrid").onclick = async e => {
  const b = e.target.closest("button"); if(!b) return;
  const p = cur[+b.dataset.i];
  if(b.dataset.a === "dl") return save(p);
  if(!confirm("Hapus foto dari " + p.name + "? Tindakan ini tidak bisa dibatalkan.")) return;
  const r = await db.rpc("owner_delete", {p_pass: owner, p_path: p.path});
  if(r.error) return alert("Gagal: " + r.error.message);
  loadAdmin();
};
$("aDl").onclick = async () => {
  if(!cur.length) return alert("Belum ada foto.");
  if(!confirm("Unduh " + cur.length + " foto?")) return;
  for(const p of cur){ await save(p); await new Promise(r => setTimeout(r, 400)); }
};
$("aQr").onclick = () => { qrBack = "admin"; show("qr"); drawQR(); };
$("aOut").onclick = () => { owner = ""; sessionStorage.removeItem("owner"); show("home"); };
$("aSave").onclick = async () => {
  if(!$("aDate").value) return;
  const r = await db.rpc("owner_set_end", {p_pass: owner, p_end: $("aDate").value + "T23:59:00+07:00"});
  if(r.error) return alert("Gagal: " + r.error.message);
  toast("Tanggal acara disimpan ✓"); loadAdmin();
};

// 3. Bingkai QR
$("qrBtn").onclick = () => { show("qr"); drawQR(); };
$("back").onclick = () => show(qrBack);
function drawQR(){
  const c = $("qrCanvas"), x = c.getContext("2d"), W = c.width, H = c.height;
  x.fillStyle = "#faf8f4"; x.fillRect(0, 0, W, H);
  // bingkai ganda
  x.strokeStyle = "#b9a98c"; x.lineWidth = 4; x.strokeRect(30, 30, W-60, H-60);
  x.lineWidth = 1.5; x.strokeRect(48, 48, W-96, H-96);
  // hiasan sudut
  x.lineWidth = 3;
  [[60,60,1,1],[W-60,60,-1,1],[60,H-60,1,-1],[W-60,H-60,-1,-1]].forEach(([px,py,sx,sy]) => {
    x.beginPath(); x.arc(px+sx*30, py+sy*30, 30, 0, 7); x.stroke();
    x.beginPath(); x.arc(px+sx*30, py+sy*30, 14, 0, 7); x.stroke();
    x.beginPath(); x.moveTo(px+sx*60, py); x.quadraticCurveTo(px+sx*110, py+sy*40, px+sx*170, py); x.stroke();
    x.beginPath(); x.moveTo(px, py+sy*60); x.quadraticCurveTo(px+sx*40, py+sy*110, px, py+sy*170); x.stroke();
  });
  x.fillStyle = "#222"; x.textAlign = "center";
  x.font = "52px Georgia,serif"; x.fillText("B A G I K A N", W/2, 250);
  x.font = "italic 130px Georgia,serif"; x.fillText("Foto", W/2, 390);
  x.font = "44px Georgia,serif"; x.fillText("K A L I A N   D I   S I N I", W/2, 470);
  // QR
  const url = location.origin + location.pathname + "?a=" + ALBUM;
  const q = qrcode(0, "M"); q.addData(url); q.make();
  const n = q.getModuleCount(), size = 460, cell = size / n, ox = (W-size)/2, oy = 530;
  x.fillStyle = "#fff"; x.fillRect(ox-20, oy-20, size+40, size+40);
  x.fillStyle = "#000";
  for(let r = 0; r < n; r++) for(let k = 0; k < n; k++)
    if(q.isDark(r, k)) x.fillRect(ox + k*cell, oy + r*cell, cell+.5, cell+.5);
  x.fillStyle = "#777"; x.font = "30px Georgia,serif";
  x.fillText("Pindai kode QR dan unggah momenmu", W/2, 1120 - 60);
}
$("saveQr").onclick = () => {
  const a = document.createElement("a");
  a.download = "qr-album.png"; a.href = $("qrCanvas").toDataURL("image/png"); a.click();
};
</script>
